[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metoffice-radar-viewer"
version = "0.1.0"
description = "High-detail UK Met Office radar viewer with Tkinter and Cartopy"
readme = "README.md"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "scitools-iris",
    "numpy",
    "matplotlib",
    "cartopy",
    "tkinterdnd2"
]

[project.scripts]
metoffice-radar = "metoffice_radar.app:main"
